# ci-mon-dash-01 — Kibana + Fleet Server + Heartbeat
# 4 vCPU / 8 GB RAM / 50 GB on /data
#
# Deploy:  cd dash-01 && docker compose up -d
# Requires: ../certs copied here, and .env filled in (after ES is up on db-01).
services:
  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: kibana
    restart: unless-stopped
    environment:
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECURITY_ENCRYPTION_KEY=${SECURITY_ENCRYPTION_KEY}
      - REPORTING_ENCRYPTION_KEY=${REPORTING_ENCRYPTION_KEY}
      - CA_TRUSTED_FINGERPRINT=${CA_TRUSTED_FINGERPRINT}
    mem_limit: 2g
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ../certs:/usr/share/kibana/config/certs:ro
      - /data/kibana:/usr/share/kibana/data
    ports:
      - "5601:5601"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -k https://localhost:5601/api/status | grep -q '\"level\":\"available\"'",
        ]
      interval: 20s
      timeout: 10s
      retries: 30

  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    container_name: fleet-server
    restart: unless-stopped
    environment:
      - FLEET_SERVER_ENABLE=true
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_ELASTICSEARCH_HOST=https://ci-mon-db-01:9200
      - FLEET_SERVER_ELASTICSEARCH_CA=/certs/ca/ca.crt
      - FLEET_SERVER_SERVICE_TOKEN=${FLEET_SERVER_SERVICE_TOKEN}
      # TLS cert Fleet Server presents to enrolling agents (k8s)
      - FLEET_SERVER_CERT=/certs/fleet-server/fleet-server.crt
      - FLEET_SERVER_CERT_KEY=/certs/fleet-server/fleet-server.key
      - FLEET_URL=https://ci-mon-dash-01:8220
      - FLEET_CA=/certs/ca/ca.crt
    mem_limit: 1g
    volumes:
      - ../certs:/certs:ro
      - /data/fleet-server:/usr/share/elastic-agent/state
    ports:
      - "8220:8220"
    depends_on:
      kibana:
        condition: service_healthy

  heartbeat:
    image: docker.elastic.co/beats/heartbeat:${STACK_VERSION}
    container_name: heartbeat
    restart: unless-stopped
    user: root
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    command: ["--strict.perms=false", "-e"]
    mem_limit: 512m
    volumes:
      - ./heartbeat/heartbeat.yml:/usr/share/heartbeat/heartbeat.yml:ro
      - ../certs:/usr/share/heartbeat/certs:ro
      - /data/heartbeat:/usr/share/heartbeat/data
    depends_on:
      kibana:
        condition: service_healthy
