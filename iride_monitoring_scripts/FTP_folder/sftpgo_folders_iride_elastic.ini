[CONFIG]
# ============================================================
# Elasticsearch — DISABILITATO finche' l'endpoint Elastic IRIDE
# non e' disponibile. Mettere ELASTIC_ENABLED = True quando avrai
# MONITORING_URL e MONITORING_APIKEY validi.
# ============================================================
ELASTIC_ENABLED = True

MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY = 
MONITORING_VERIFY_CERTS = False


# Indice Elastic dedicato per inventory SFTPGo (utenti + cartelle).
INVENTORY_INDEX = logs-iride-sftpgo-inventory.monitoring-default

LOG_FILE_NAME = collector_sftpgo_folders_iride_elastic.log

# ============================================================
# SFTPGo credentials e API key
# ============================================================
[SFTPGO]
BASE_URL = https://ftp.dingest.iride-cyberitaly.space

# Credenziali admin (per /api/v2/token, /api/v2/users, gestione utenti)
USERNAME = cyberitalyadmin
PASSWORD = 

# API Key user-scope legata direttamente all'utente target (refactor 25/06/2026).
# Generata via POST /api/v2/apikeys con scope=2 e user="ispra".
# NIENTE suffisso .username nell'header: la key e' gia' "bound" a ispra.
# Per monitorare un altro utente serve un'API key separata per quel utente.
API_KEY = ubMNsMjYEqggRrsLsyozmK.6StWgBZybPsKnX2Yoe5Z75

# ============================================================
# Comportamento inventory
# ============================================================
[SFTPGO_INVENTORY]
# Se True, forza un rescan della quota prima di leggere used_quota.
# Utile per avere valori freschi al costo di qualche secondo di attesa.
TRIGGER_QUOTA_SCAN = True
QUOTA_SCAN_WAIT_SECONDS = 5

# Se True, esegue il walking ricorsivo del filesystem dell'utente.
# Richiede API_KEY configurata e allow_api_key_auth=true sull'utente.
WALK_FILESYSTEM = True
MAX_DEPTH = 10
MAX_FOLDERS = 500

HTTP_TIMEOUT = 30

# Soglie freshness (per il campo upload_freshness_status nel doc utente)
FRESHNESS_OK_MINUTES = 60
FRESHNESS_STALE_MINUTES = 1440

# ============================================================
# Capacita' volume — aggiunta 03/08/2026 dopo l'incidente di
# saturazione del PVC (anomalia SFTP del 02/08/2026).
# ============================================================
# Il campo quota_pct_used resta null perche' l'utente "ispra" ha quota
# SFTPGo illimitata (quota_size = 0). Il vincolo reale e' la capacita'
# del filesystem del PVC, che la REST API di SFTPGo non espone.
#
# Modalita' di rilevamento:
#   auto    = prova kubectl, in fallback usa la cache, poi il valore
#             statico qui sotto. CONSIGLIATA.
#   kubectl = solo kubectl, nessun fallback. Se il cluster non risponde
#             le metriche volume mancano per quel run.
#   static  = solo VOLUME_CAPACITY_BYTES, nessuna chiamata a kubectl.
#             Da usare se il collector gira su un host senza kubectl.
VOLUME_CAPACITY_MODE = auto

# --- Parametri discovery via kubectl ---
# Richiede kubectl configurato e raggiungibile dall'utente che esegue il
# collector (es. ci-mon-dash-01). Il comando eseguito e':
#   kubectl get pods -n <NS> -l <SELECTOR> -o jsonpath=...
#   kubectl exec <pod> -n <NS> -- df -k -P <MOUNT_PATH>
# Si usa df -k -P (POSIX) e non -B1: -B e' una estensione GNU non
# disponibile su immagini busybox, -P evita il wrapping delle righe.
KUBECTL_BIN = kubectl
K8S_NAMESPACE = adam-ftp
K8S_POD_SELECTOR = app.kubernetes.io/name=sftpgo
VOLUME_MOUNT_PATH = /var/lib/sftpgo
KUBECTL_TIMEOUT = 30

# Validita' della cache su disco (.volume_capacity_cache.json), in minuti.
# La capacita' di un PVC cambia solo in caso di espansione, quindi una
# cache lunga e' sicura e copre i run in cui kubectl non risponde.
VOLUME_CAPACITY_CACHE_MINUTES = 1440

# --- Fallback statico ---
# Usato in modalita' static, o in auto quando kubectl e cache falliscono.
# Capacita' UTILE da df, non la size nominale del PVC (300Gi nominali =
# ~295GiB utili dopo overhead ext4). 0 = disabilitato.
# In modalita' auto questo valore e' solo una rete di sicurezza: il dato
# reale arriva da kubectl e si aggiorna da solo se il PVC viene espanso.
VOLUME_CAPACITY_BYTES = 316659348275

# ============================================================
# Soglia eta' archivio — aggiunta 03/08/2026
# ============================================================
# NON e' una retention policy concordata: alla data odierna MEEO non ha
# configurato alcuna politica di cancellazione, e nessun file risulta
# mai essere stato rimosso dall'avvio del flusso (02/07/2026).
#
# RETENTION_DAYS e' la nostra soglia interna di allarme, allineata alla
# finestra operativa indicata da F. Venneri (max 2 settimane). Se il file
# piu' vecchio la supera, il campo retention_breach segnala che nessuna
# cancellazione sta avvenendo.
#
# Da riallineare alla finestra reale quando MEEO fornira' la
# configurazione effettiva del rolling.
RETENTION_DAYS = 15

# Tolleranza in giorni per evitare falsi positivi quando la cancellazione
# gira una volta al giorno e il file piu' vecchio e' appena oltre soglia.
RETENTION_GRACE_DAYS = 2.0

# Cartelle su cui applicare il controllo sull'eta' dei file. Match per
# sottostringa sul path, case-insensitive, lista separata da virgole.
# Lasciare vuoto per applicare il controllo a tutte le cartelle.
# Nota: NEW e QUARANTINE sono escluse di proposito — la prima e' la
# landing zone (svuotata dall'ingestione), la seconda contiene scarti.
RETENTION_PATHS = MANAGED/NEW
