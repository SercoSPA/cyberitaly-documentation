; =============================================================================
; kpi_iride_keycloak_events_iride_elastic.ini
; =============================================================================
; Config per lo script Keycloak login events monitoring.
; Reference: CIMS-38 (Davide Foschi, CGI).
; =============================================================================

[CONFIG]
; -----------------------------------------------------------------------------
; Elasticsearch ingestion
; -----------------------------------------------------------------------------
ELASTIC_ENABLED = True
MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY = 
MONITORING_VERIFY_CERTS = False

; Pattern matcha "logs-iride-*" della API key esistente.
MONITORING_INDEX = logs-iride-keycloak-events.monitoring-default

SERVICE_NAME_FIELD = iride-cyberitaly
LOG_FILE_NAME = kpi_iride_keycloak_events_iride_elastic.log

; =============================================================================
; Keycloak (valori confermati da Davide su CIMS-38)
; =============================================================================
[KEYCLOAK]
KEYCLOAK_URL = https://identity.iride-cyberitaly.space
REALM_NAME = cyberitaly

; admin-cli e' public client, no secret richiesto
CLIENT_ID = 
CLIENT_SECRET =

; Account monitoring (CGI, CIMS-38)
ADMIN_USERNAME = cyberitaly-monitoring
ADMIN_PASSWORD = 

; Client target da monitorare per gli eventi (default: webapp-client)
; Cambiare qui se in futuro va monitorato un client diverso, senza toccare codice.
TARGET_CLIENT = webapp-client

; Numero max di eventi per tipo (LOGIN + LOGIN_ERROR) per singolo run.
; Se il cron gira ogni 5 min, 100 e' abbondante. Se aumenti frequenza cron,
; puoi ridurre. Se aumenti max, i doc su Elastic crescono lineari.
EVENTS_MAX = 100

TIMEOUT_SEC = 60
# NUOVI
BULK_SIZE = 500
ELASTIC_TIMEOUT_SEC = 30
# NUOVI (EVENTS_MAX e' stato sostituito)
EVENT_TYPES = LOGIN,LOGIN_ERROR
EVENTS_PAGE_SIZE = 100
EVENTS_MAX_PAGES = 50
# Deve essere >= 2x l'intervallo del cron, per coprire run saltate.
# Cron ogni 5 min -> 30 e' abbondante e senza costi (dedup via _id).
LOOKBACK_MINUTES = 30
