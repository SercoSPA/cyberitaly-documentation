; =============================================================================
; kpi_iride_keycloak_user_statistics_iride_elastic.ini
; =============================================================================
; Config per lo script Keycloak user statistics.
; Credenziali monitoring fornite da Davide Foschi (CGI) via CIMS-38.
; =============================================================================

[CONFIG]
; -----------------------------------------------------------------------------
; Elasticsearch ingestion
; -----------------------------------------------------------------------------
ELASTIC_ENABLED = True
MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

; Pattern matcha "logs-iride-*" della API key esistente.
MONITORING_INDEX = logs-iride-keycloak-users.monitoring-default

SERVICE_NAME_FIELD = iride-cyberitaly
LOG_FILE_NAME = kpi_iride_keycloak_user_statistics_iride_elastic.log

; =============================================================================
; Keycloak
; =============================================================================
[KEYCLOAK]
; URL base Keycloak (senza /realms/... — path viene aggiunto in codice)
; NOTA CIMS-38: Davide ha corretto il realm il 03/07/2026. Verificare
; sempre l'URL aggiornato sul ticket.
KEYCLOAK_URL = https://identity.iride-cyberitaly.space

; Realm target (aggiornato secondo CIMS-38)
REALM_NAME = cyberitaly

; Client ID + secret usati per il grant type=password
; admin-cli e' public client di default di Keycloak, no secret richiesto
CLIENT_ID = 
CLIENT_SECRET =

; Account monitoring dedicato (CGI, CIMS-38)
ADMIN_USERNAME = cyberitaly-monitoring
ADMIN_PASSWORD =

; ID del gruppo DPAD_Services (opzionale, lascia vuoto se non serve conteggio)
; Recuperabile con: GET /admin/realms/{REALM}/groups
DPAD_SERVICES_GROUP_ID =

; Timeout per singola chiamata Keycloak (secondi)
TIMEOUT_SEC = 60

