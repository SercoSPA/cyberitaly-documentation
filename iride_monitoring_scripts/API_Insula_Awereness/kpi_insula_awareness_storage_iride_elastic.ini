[CONFIG]
ELASTIC_ENABLED = True
MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY = 
MONITORING_VERIFY_CERTS = False

AWARENESS_INDEX = logs-iride-insula-awareness.monitoring-default

# ============================================================
# MOCK MODE — usa wallet/quotas/storage finti per test a secco.
# Tienilo True finche' il microservizio "server" di Insula non risponde:
# al 24/06 (CIMS-39) /wallets tornava nginx 500. Flippa a False quando e' up.
# ============================================================
MOCK_MODE = False

# ============================================================
# Insula API (CGI) — endpoint da CIMS-39
# Base + Bearer token. Doc: https://cgi-italy.github.io/insula/apis/cyberitaly/
# ============================================================
[INSULA]
BASE_URL = https://iride-cyberitaly.space/secure/api/v2.0

# ============================================================
# Keycloak (credenziali ricevute da Davide Foschi su CIMS-38, 13/07/2026)
# realm cyberitaly, admin-cli public client, grant_type=password.
# ============================================================
[KEYCLOAK]
URL = https://identity.iride-cyberitaly.space
REALM = cyberitaly
CLIENT_ID = admin-cli
CLIENT_SECRET =
USERNAME = cyberitaly-monitoring
PASSWORD = 

# ============================================================
# Tracking Awareness (wallet + storage)
# ============================================================
[INSULA_AWARENESS]
# Paginazione Spring HATEOAS (?size=&page=)
PAGE_SIZE = 100
MAX_PAGES = 50

# Quota di default per utente senza override (CIMS-39: 5000 MB)
DEFAULT_QUOTA_MB = 5000

# Soglia % oltre la quale un utente viene contato "vicino al limite"
STORAGE_ALERT_PCT = 80

# True = 1 doc Elastic per utente. False = solo l'aggregato (meno volume).
EMIT_INDIVIDUAL_USERS = True

# Ritardo opzionale (sec) tra le chiamate storage per-utente.
# Davide (CIMS-39): rate limit trascurabile a ~10-15 call/h, quindi 0 va bene.
INTER_CALL_DELAY = 0

HTTP_TIMEOUT = 30

# ============================================================
# Account test/servizio da ESCLUDERE dagli aggregati.
# Match ESATTO sullo username (case-insensitive), niente euristiche.
# NB: cmcc-dev / cmcc-predev / cmcc-test sono utenti CMCC REALI -> NON qui,
#     altrimenti perdi ~115 GB di storage vero dai totali.
# Rivedi tu la membership: pippo? cesare.rossi? admin? -> decisione tua.
# ============================================================
KNOWN_TEST_ACCOUNTS = test-idp, demo_user_01, pippo

