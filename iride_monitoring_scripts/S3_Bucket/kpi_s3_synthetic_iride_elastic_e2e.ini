; =============================================================================
; kpi_s3_synthetic_iride_elastic_e2e.ini
; =============================================================================
; Config dello script kpi_s3_synthetic_iride_elastic_e2e.py.
;
; Cosa fa lo script: probe attivo (write/read/delete) su bucket S3 target
; per misurare latenze reali di upload, download, delete + integrity check.
; Emette 1 doc Elastic per bucket probato, con event_type=s3_probe_e2e.
;
; Indice separato da bucket_folders_size perche' e' un dataset diverso:
;   - Qui: metriche di health/latency (KPI di servizio)
;   - Bucket folders: metriche di inventory (KPI di storage)
;
; Separazione permette dashboard/alert distinti in Kibana:
;   - "S3 latency degradation" alert (su questo index)
;   - "Storage growth trends" dashboard (sull'index bucket folders)
; =============================================================================

[CONFIG]
; -----------------------------------------------------------------------------
; Elasticsearch ingestion
; -----------------------------------------------------------------------------
ELASTIC_ENABLED = True
MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

; Indice dedicato per KPI di health/latency S3 (probe sintetici).
; Pattern matcha "logs-iride-*" della API key esistente.
MONITORING_INDEX = logs-iride-s3-health.monitoring-default

; Campo Elastic "service_name": identifica il servizio nella dashboard.
SERVICE_NAME_FIELD = iride-cyberitaly

; Log file locale (JSON puro, 1 doc per riga). Backup se Elastic e' down.
LOG_FILE_NAME = kpi_s3_synthetic_iride_elastic_e2e.log

; -----------------------------------------------------------------------------
; Probe behavior
; -----------------------------------------------------------------------------
; Bucket target del probe. Comma-separated. Modificabile senza toccare codice.
; NOTA: lo script SCRIVE realmente su S3 nel prefisso dedicato (vedi sotto),
; poi ripulisce. Zero residui se il probe completa OK.
TARGET_BUCKETS = cyberitaly-fmwk-shared-e2etest,cyberitaly-fmwk-output-e2etest,cyberitaly-dingest-container-e2etest

; Prefisso dedicato al probe. Isolato dai dati veri, permette cleanup facile.
; Se vedete oggetti sotto questo prefisso in produzione, e' bug del probe
; (upload OK ma delete fallito). Alert su presenza.
PROBE_KEY_PREFIX = __monitoring/

; Payload size in bytes. Piccolo per non sprecare I/O ma abbastanza per
; misurare latenza realistica (non solo overhead handshake).
PAYLOAD_SIZE_BYTES = 419

; Timeout per singola operazione S3 (secondi). Se supera → status=TIMEOUT.
S3_TIMEOUT_SEC = 30

; -----------------------------------------------------------------------------
; S3 credentials (framework - stessa key usata da bucket_folders)
; -----------------------------------------------------------------------------
[IRIDE_FRAMEWORK_CREDENTIALS]
aws_access_key_id = 
aws_secret_access_key = 
region_name = gra
endpoint_url = https://s3.gra.io.cloud.ovh.net

; -----------------------------------------------------------------------------
; S3 credentials (ingestion)
; -----------------------------------------------------------------------------
[IRIDE_INGESTION_CREDENTIALS]
aws_access_key_id = 
aws_secret_access_key = 
region_name = gra
endpoint_url = https://s3.gra.io.cloud.ovh.net

; -----------------------------------------------------------------------------
; Mappa bucket → credenziali da usare (adatta ai nomi effettivi dello script)
; -----------------------------------------------------------------------------
[BUCKET_CREDENTIALS_MAPPING]
cyberitaly-fmwk-shared-e2etest = framework
cyberitaly-fmwk-output-e2etest = framework
cyberitaly-dingest-container-e2etest = ingestion

