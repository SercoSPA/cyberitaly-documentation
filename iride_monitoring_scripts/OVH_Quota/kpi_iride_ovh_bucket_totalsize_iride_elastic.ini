[CONFIG]
# ============================================================
# Elasticsearch — DISABILITATO finche' l'endpoint Elastic IRIDE
# non e' disponibile (oggi siamo ancora in dry-run sulla VM).
# Mettere ELASTIC_ENABLED = True solo quando MONITORING_URL e APIKEY
# saranno valorizzati per davvero.
# ============================================================
ELASTIC_ENABLED = True

MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

# Indice dedicato per il monitoring storage OVH IRIDE.
# Separato dall'indice metrics-cachestorage usato in DESP.
MONITORING_INDEX = logs-iride-ovh-bucket-totalsize.monitoring-default

LOG_FILE_NAME = kpi_iride_ovh_bucket_totalsize_iride_elastic_terminal.log

# File NDJSON dedicato: contiene SOLO documenti JSON (uno per riga),
# senza prefissi timestamp ne' prosa. Formato pronto per ingestion
# via Filebeat / Logstash / direct bulk index verso Elastic.
NDJSON_FILE_NAME = kpi_iride_ovh_bucket_totalsize_iride_elastic.log

# ============================================================
# OVH credentials — Application 'Cyberitaly Serco monitoring tk.2444'
# Fornite da Stefano (Serco) per il tenant OVH CYIT-01 (CyberItaly-01)
# che ospita il progetto IRIDE.
# Read-only: queste credenziali NON hanno permessi PUT/POST/DELETE.
#
# PROJECT_ID: tenant CYIT-01 confermato da Stefano (23/06/2026).
# REGION: presumibilmente GRA. Da verificare al primo test (potrebbe
# essere GRA9/GRA11/etc. se in futuro emergono sotto-region specifiche).
# ============================================================
[OVH]
ENDPOINT = ovh-eu
APPLICATION_KEY = 
APPLICATION_SECRET = 
CONSUMER_KEY = 

# Project ID fornito da Stefano (23/06/2026) - tenant CYIT-01 (CyberItaly-01).
# Il tenant OVH si chiama CYIT-01 e ospita il progetto IRIDE come sotto-cliente.
PROJECT_ID = 

# Region confermata GRA9 al test del 23/06/2026 (su quota_compute con region
# 'GRA' generica il payload tornava null tranne keymanager; con 'GRA9' tutto
# popolato). Stessa region usata anche per storage per coerenza.
REGION = GRA

# ============================================================
# IRIDE — parametri di output
# ============================================================
[IRIDE]
# Nome simbolico del servizio (campo 'service_name' nei doc Elastic).
# Utile per filtrare in Kibana se in futuro lo stesso indice riceve
# dati da piu' tenant o piu' progetti.
SERVICE_NAME = iride-cyberitaly

# Pausa tra una scrittura Elastic e la successiva (in secondi).
# Equivalente al time.sleep(1) dello script DESP service_ovhbucket_totalsize.
# Tenuto a 0.5s per non sovraccaricare Elastic se i bucket sono molti.
INTER_DOC_SLEEP_SEC = 0.5
