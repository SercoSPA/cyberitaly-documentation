[CONFIG]
# ============================================================
# Elasticsearch — DISABILITATO finche' l'endpoint Elastic IRIDE
# non e' disponibile (oggi siamo ancora in dry-run sulla VM).
# Mettere ELASTIC_ENABLED = True solo quando MONITORING_URL e APIKEY
# saranno valorizzati per davvero.
# ============================================================
ELASTIC_ENABLED = True

MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

# Indice dedicato per la quota compute OVH IRIDE.
# Separato dall'indice metrics-iride-ovh-bucket-totalsize che monitora
# l'object storage (S3). Qui invece sono compute resources: VM, RAM,
# volumi, network, load balancer.
MONITORING_INDEX = logs-iride-ovh-compute-quota.monitoring-default

LOG_FILE_NAME = kpi_iride_ovh_compute_quota_iride_elastic_terminal.log

# File NDJSON dedicato: contiene SOLO documenti JSON (uno per riga),
# senza prefissi timestamp ne' prosa. Formato pronto per ingestion
# via Filebeat / Logstash / direct bulk index verso Elastic.
NDJSON_FILE_NAME = kpi_iride_ovh_compute_quota_iride_elastic.log

# ============================================================
# OVH credentials — Application 'Cyberitaly Serco monitoring tk.2444'
# Fornite da Stefano (Serco) per il tenant OVH CYIT-01 (CyberItaly-01)
# che ospita il progetto IRIDE.
# Read-only: queste credenziali NON hanno permessi PUT/POST/DELETE.
#
# PROJECT_ID: tenant CYIT-01 confermato da Stefano (23/06/2026).
# SERVICE_NAME: UUID usato nel path API /cloud/project/{SERVICE_NAME}/...
#   In DESP era distinto dal PROJECT_ID. Per IRIDE assumiamo uguali a
#   PROJECT_ID. Se in futuro Stefano ci da' un service_name diverso,
#   basta aggiornare questo campo.
# REGION: presumibilmente GRA. Da verificare al primo test (potrebbe
#   essere una sotto-region tipo GRA9/GRA11 come succedeva su DESP).
# ============================================================
[OVH]
ENDPOINT = ovh-eu
APPLICATION_KEY = 
APPLICATION_SECRET = 
CONSUMER_KEY = 

PROJECT_ID = 
SERVICE_NAME = 
# Region confermata GRA9 al test del 23/06/2026 (payload completo restituito).
# Con region 'GRA' generica il payload tornava null tranne keymanager.
REGION = GRA7

# ============================================================
# IRIDE — parametri di output
# ============================================================
[IRIDE]
# Nome simbolico del servizio (campo 'service_name' nei doc Elastic).
# Coerente con kpi_iride_ovh_bucket_totalsize.
SERVICE_NAME = iride-cyberitaly
