; =============================================================================
; his_central_health_iride_elastic.ini
; =============================================================================
; Config per lo script HIS-Central health probe (livelli 2+4).
;
; Livello 2: reachability + latency
; Livello 4: freshness dati (timestamp piu' recente scansionato)
;
; Endpoint HIS-Central: broker GeoDAB (MEEO/CNR-IIA), aggrega ISPRA
; livelli idrometrici LOM/PIE/EMR. Token dell'utenza CyberItaly nell'URL,
; non scade a rotazione.
; =============================================================================

[CONFIG]
; -----------------------------------------------------------------------------
; Elasticsearch ingestion
; -----------------------------------------------------------------------------
ELASTIC_ENABLED = True
MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

; Index dedicato per health + freshness HIS-Central
SYNTHETIC_INDEX = logs-iride-his-central-health.monitoring-default


; =============================================================================
; HIS-Central endpoint
; =============================================================================
[HIS_CENTRAL]
; URL base broker GeoDAB con token utenza CyberItaly (non scade).
BASE_URL = https://his-central.geodab.eu/gs-service/services/essi/token/his_central-7c7858ba-ebdc-41bd-bb6f-577b502f5d60/view/his-central-level-stream-pie-lom-emr/om-api

; Path di probe. limit=50 e' un compromesso: payload piccolo (~40KB)
; ma abbastanza record per estrarre max(phenomenonTime.end) affidabile.
; HIS-Central NON garantisce ordinamento cronologico, quindi scanniamo
; un batch e calcoliamo statistiche cross-record.
PROBE_PATH = /observations?limit=50


; =============================================================================
; Soglie reachability (livello 2)
; =============================================================================
[HIS_CENTRAL_HEALTH]
; Latenza HTTP in millisecondi
LATENCY_OK_MS = 3000
LATENCY_SLOW_MS = 10000
HTTP_TIMEOUT = 30


; =============================================================================
; Soglie freshness dati (livello 4)
; =============================================================================
[HIS_CENTRAL_FRESHNESS]
; FRESH: dati aggiornati entro N minuti (default: 3 ore).
; Per idrometrico ISPRA il rate tipico e' ~15min per stazione, quindi
; 3h di lag e' comodo (permette lag ingest broker).
FRESH_MAX_MINUTES = 180

; STALE: sopra FRESH ma sotto STALE = warning.
; VERY_STALE: sopra STALE = critical, promuove response_status a FAIL.
; Default 24h e' generoso — se sappiamo che il consumer IRIDE ha SLA
; piu' stringente lo si abbassa qui.
STALE_MAX_MINUTES = 1440

; ARCHIVE CAP: sopra questa soglia (in minuti) il record e' considerato
; "serie storica" (catalogo, non ingest). Viene ESCLUSO da percentili,
; stale count e per-source. Il worst raw pre-cap resta in
; data_worst_raw_minutes per debug.
;
; Default 30 giorni (43200 min): HIS Central serve talvolta record di
; anni fa (2004-2006) misti a dati recenti. Se ne fanno parte di
; percentili, il p95 diventa 20 anni e i grafici Kibana sono inutili.
;
; Contesto reale osservato (14/07/2026): batch 50 record HIS Central
; conteneva 17 record Arpae con phenomenonTime.end di 6-22 anni fa,
; misti a dati freschi. Il cap li tratta correttamente come catalogo.
ARCHIVE_CAP_MINUTES = 43200

; Numero di stazioni da campionare nel doc (sample_stations).
; Zero impact sulla logica, serve solo per debugging in Kibana Discover.
SAMPLE_SIZE = 10

