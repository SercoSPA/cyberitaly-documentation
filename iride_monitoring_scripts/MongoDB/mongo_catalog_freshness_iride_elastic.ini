[CONFIG]
# ============================================================
# Elasticsearch — DISABILITATO finche' l'endpoint IRIDE non e' disponibile.
# ============================================================
ELASTIC_ENABLED = False

MONITORING_URL = https://CHANGE_ME.iride.space/elasticsearch/
MONITORING_APIKEY = CHANGE_ME
MONITORING_VERIFY_CERTS = True

FRESHNESS_INDEX = metrics-iride-catalog-freshness.monitoring-default

# ============================================================
# MongoDB — credenziali fornite da MEEO via CIMS-45 (16/06/2026)
# Username: monitoring (read-only)
# Password: Cyber1taly!
# DB accessibili: admin, catalog, dapapi
#
# IMPORTANTE: l'hostname/IP esatto da usare dalla VM ci-mon-dash-01 NON
# e' stato ancora confermato da MEEO. Quando arriva la conferma, sostituire
# CHANGE_ME_HOST con il valore reale.
# ============================================================
[MONGODB]
HOST = CHANGE_ME_HOST_FROM_MEEO
PORT = 27017
USERNAME = monitoring
PASSWORD = Cyber1taly!
AUTH_DB = admin
TIMEOUT_MS = 10000

# ============================================================
# Catalog freshness — quali collection monitorare e con quali soglie
# ============================================================
[CATALOG_FRESHNESS]
DATABASE = catalog

# Lascia vuoto per autodiscovery di tutte le collection del DB.
# Una volta validato il setup, puoi restringere alle sole rilevanti:
# COLLECTIONS = products,collections,ingestion_log
COLLECTIONS =

# Candidati per il campo "timestamp di creazione" del documento.
# Lo script prova in ordine e usa il primo che esiste con valori non-null.
TIMESTAMP_FIELD_CANDIDATES = createdAt,created_at,creation_date,timestamp,date,inserted_at,ingestion_time,publishedAt,updated_at

# Soglie per classificare la freshness (minuti)
# OK     < 60 min  (dati arrivati nell'ultima ora — pipeline attiva)
# STALE  60-720    (1-12 ore: pipeline rallentata o sospetta)
# NO_DATA > 720    (>12 ore: pipeline ferma)
THRESHOLD_OK_MINUTES = 60
THRESHOLD_STALE_MINUTES = 720
