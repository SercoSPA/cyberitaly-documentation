[CONFIG]
# ============================================================
# Elastic ingestion — DISABILITATO finche' Elastic IRIDE non e' raggiungibile.
# Quando il cluster Elastic interno (elastic-cluster-es-http.logging.svc:9200)
# sara' esposto o avremo un API key valida, mettere ELASTIC_ENABLED = True.
# ============================================================
ELASTIC_ENABLED = True

MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

INVENTORY_INDEX = logs-iride-k8s-pod-health.monitoring-default

LOG_FILE_NAME = collector_k8s_pod_health_iride_elastic.log

# ============================================================
# K8S — kubectl gia' configurato dall'infra Serco sulla VM ci-mon-dash-01.
# ============================================================
[K8S]
KUBECTL_BIN = /usr/local/bin/kubectl

# Path al kubeconfig. Lascia vuoto per usare $HOME/.kube/config (default).
# Se il file globale e' in /home/.kube/kubeconfig e infra non ha fatto chown
# per l'utente monitoring, specifica il path qui (dopo aver fatto chmod
# +r o copy nella home dell'utenza).
KUBECONFIG =

# Lista comma-separated dei namespace da monitorare.
# Direttiva Stefano 25/06/2026: K8s probe sostituisce esposizione vRack
# per MongoDB e ADAM. Pattern riusabile su tutti i microservizi.
#
# Famiglie monitorate:
#   ADAM (6 ns)     - microservizi catalogo/API/ingestion/MongoDB
#   Insula (1 ns)   - platform (awareness, perception, intellect,
#                     keycloak, postgis, server, broker, gateway, etc)
#   Logging (1 ns)  - elastic-cluster + fluentd DaemonSet
#                     (cattura red flag come restart 1087+ su fluentd)
#
# NOTA: cyberitaly-workflows e' vuoto al 26/06/2026, NON incluso.
# Quando MEEO/CGI inizieranno a deployare workflow Argo, aggiungerlo.
TARGET_NAMESPACES = adam-catalog,adam-dapapi,adam-dret,adam-ftp,adam-mongo,adam-wxs,platform,logging,argocd

# Timeout per ciascuna chiamata kubectl (secondi). Default 30s e' generoso.
KUBECTL_TIMEOUT = 30

# Se True, chiama anche `kubectl top pods` per ciascun namespace per
# ottenere metriche real-time CPU/RAM (via metrics-server).
# Aggiunge ~1-2s per namespace al runtime dello script.
# Se metrics-server non e' installato sul cluster o non risponde, i campi
# cpu_current_millicores e memory_current_bytes saranno None ma lo script
# NON fallisce: continua col monitoring dello stato pod normale.
# Verificato 24/06/2026: metrics-server presente sul cluster IRIDE.
KUBECTL_TOP_ENABLED = True

# Soglie per derivare health_status da restart_count.
# Sotto questa soglia → HEALTHY (se phase=Running e ready=count)
# Tra questa e CRITICAL → DEGRADED
# Sopra CRITICAL → DEGRADED (etichettato anche da campi separati)
RESTART_DEGRADED_THRESHOLD = 5
RESTART_CRITICAL_THRESHOLD = 50

