[CONFIG]
# ============================================================
# Elastic ingestion — DISABILITATO finche' Mahdi non passa URL + API key
# dell'Elastic IRIDE Serco.
# ============================================================
ELASTIC_ENABLED = True

MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

INVENTORY_INDEX = logs-iride-k8s-cluster-audit.monitoring-default

LOG_FILE_NAME = audit_k8s_cluster_full_iride_elastic.log

# ============================================================
# K8S — kubectl gia' configurato dall'infra Serco sulla VM ci-mon-dash-01.
# ============================================================
[K8S]
KUBECTL_BIN = /usr/local/bin/kubectl

# Path al kubeconfig. Lascia vuoto per usare $HOME/.kube/config (default).
KUBECONFIG =

# Namespace da ESCLUDERE dall'audit (comma-separated).
# Default: nessuno (audit di TUTTI i namespace).
# Esempi utili se vuoi ridurre rumore:
#   EXCLUDE_NAMESPACES = kube-node-lease,kube-public,default
#
# NOTA: kube-system, kube-node-lease, kube-public sono namespace K8s "di
# sistema", contengono pod interni del cluster (coredns, kube-proxy, etc)
# che tipicamente non hanno interesse per il monitoring outcome IRIDE.
# Se il volume documenti diventa un problema in Elastic, considera di
# escluderli qui.
EXCLUDE_NAMESPACES =

# Timeout kubectl piu' generoso rispetto al collector filtrato: qui
# potenzialmente lista tutti i pod del cluster in una singola call.
KUBECTL_TIMEOUT = 60

# Soglie restart per derivazione health_status (default coerenti col
# collector_k8s_pod_health_iride_elastic.py).
RESTART_DEGRADED_THRESHOLD = 5
RESTART_CRITICAL_THRESHOLD = 50

