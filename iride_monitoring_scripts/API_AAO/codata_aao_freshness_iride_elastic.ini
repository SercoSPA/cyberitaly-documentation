[CONFIG]
# ============================================================
# Elasticsearch — DISABILITATO finche' l'endpoint IRIDE non e' disponibile.
# Quando avrai l'URL e la API key, metti ELASTIC_ENABLED = True
# e compila i campi sotto.
# ============================================================
ELASTIC_ENABLED = False

MONITORING_URL = https://CHANGE_ME.iride.space/elasticsearch/
MONITORING_APIKEY = CHANGE_ME
MONITORING_VERIFY_CERTS = True

# Indice dedicato al freshness check
FRESHNESS_INDEX =

# ============================================================
# Credenziali CoDataService AMICO Alpi Orientali (DAO network)
# Forniti via Jira CIMS-50 il 12/06/2026
# ============================================================
[CODATA_AAO]
BASE_URL = https://cortina.amicoalpiorientali.eu/CoDataService
USERNAME = 
PASSWORD = 

# ============================================================
# Configurazione del freshness check
# Mapping ID -> grandezza (scoperti via smoke test 15/06/2026):
#   id=1   temperatura
#   id=2   pioggia                          <-- DT#4 Landslides
#   id=3   umidita
#   id=4   pressione
#   id=5   vento
#   id=6   livmis (livello idrometrico)     <-- DT#1 Hydro-Meteo
#   id=7   portmis (portata)                <-- DT#1 Hydro-Meteo (complementare)
#   id=9   neve
#   id=10  radiazione
#   id=15  livmare                          <-- potenziale DT#3 Coastal
#   id=22  livello_monte
#   id=23  livello_valle
#   id=101 v_pioggia_aggregata
#   id=361 pioggia_cum
#
# Network unico accessibile a guest01: id=2 (DAO, sensori CAE)
# Numero stazioni totali: 20 (zone Veneto: Cordevole, Alleghe, Boite Fiames,
# Zunaia, Visna', Miane)
# ============================================================
[CODATA_AAO_FRESHNESS]
# Default: pioggia (DT#4) + livello idrometrico (DT#1).
# Per aggiungere portata: MEASURE_TYPE_IDS = 2,6,7
MEASURE_TYPE_IDS = 2,6

# Lascia vuoto per autodiscovery di tutte le 20 stazioni.
# Dopo il primo run vedrai quali stazioni hanno effettivamente dati per le
# misure scelte e potrai ridurre la lista per ottimizzare.
STATION_IDS =

# Soglie per classificare la freshness (minuti)
# Dati AAO arrivano ogni ~5 min, quindi:
#   OK < 60 min   (qualunque ritardo sopra i 12 cicli e' anomalo)
#   STALE 60-360  (1-6 ore: degradato ma forse temporaneo)
#   NO_DATA > 360 (oltre 6 ore: stazione probabilmente muta)
THRESHOLD_OK_MINUTES = 60
THRESHOLD_STALE_MINUTES = 360

# Finestra di lookback per cercare misure (ore)
LOOKBACK_HOURS = 24

# Limite stazioni per run (safety in modalita' autodiscovery)
MAX_STATIONS = 100
