[CONFIG]
# ============================================================
# Elasticsearch — DISABILITATO finche' l'endpoint IRIDE non e' disponibile.
# Quando avrai l'URL e la API key, metti ELASTIC_ENABLED = True
# e compila i campi sotto.
# ============================================================
ELASTIC_ENABLED = False

MONITORING_URL = https://CHANGE_ME.iride.space/elasticsearch/
MONITORING_APIKEY = CHANGE_ME
MONITORING_VERIFY_CERTS = True

# Indice dedicato al synthetic health probe (10 endpoint testati)
SYNTHETIC_INDEX = kpi-iride-codata-aao-health.monitoring-default

# ============================================================
# Credenziali CoDataService AMICO Alpi Orientali (DAO network)
# Forniti via Jira CIMS-50 il 12/06/2026
# ============================================================
[CODATA_AAO]
BASE_URL = https://cortina.amicoalpiorientali.eu/CoDataService
USERNAME = 
PASSWORD = 

# ============================================================
# Configurazione del comprehensive health probe
# Testa 10 endpoint critici di AAO. I "sample" sotto identificano
# l'oggetto specifico usato per gli endpoint che richiedono un ID.
# Cambiali se la stazione di riferimento viene dismessa.
# ============================================================
[CODATA_AAO_HEALTH]
# Network di riferimento (DAO = 2)
SAMPLE_NETWORK_ID = 2

# Stazione di riferimento per gli endpoint /api/stations/{id}/*
# 10034 = Alleghe - Col dei Baldi (pluviometro attivo, ottimo per probe)
SAMPLE_STATION_ID = 10034

# Tipo di misura per /api/measures/{id} (2 = pioggia)
SAMPLE_MEASURE_ID = 2

# Soglie classificazione globale (millisecondi sul TOTALE dei 10 probe)
# OK     < 5000   (5 sec)
# SLOW   5000-15000
# FAIL   > 15000  oppure 1+ endpoint failed
TOTAL_LATENCY_OK_MS = 5000
TOTAL_LATENCY_SLOW_MS = 15000
