[CONFIG]
# ============================================================
# Elasticsearch — DISABILITATO finche' l'endpoint IRIDE non e' disponibile.
# ============================================================
ELASTIC_ENABLED = False

MONITORING_URL = https://CHANGE_ME.iride.space/elasticsearch/
MONITORING_APIKEY = CHANGE_ME
MONITORING_VERIFY_CERTS = True

# Indice dedicato al value anomaly detection
VALUE_ANOMALY_INDEX = metrics-iride-codata-aao-value-anomaly.monitoring-default

# ============================================================
# Credenziali CoDataService AMICO Alpi Orientali (DAO network)
# Forniti via Jira CIMS-50 il 12/06/2026
# ============================================================
[CODATA_AAO]
BASE_URL = https://cortina.amicoalpiorientali.eu/CoDataService
USERNAME = guest01
PASSWORD = 

# ============================================================
# Configurazione anomaly detection
#
# Mapping ID -> grandezza (per riferimento):
#   id=2   pioggia          (DT#4)
#   id=6   livmis           (DT#1)
#   id=7   portmis          (DT#1)
#   ... vedi swagger /api/measures per l'elenco completo
#
# Esempio per monitorare anche altre misure: MEASURE_TYPE_IDS = 2,6,7,1,3
# ============================================================
[CODATA_AAO_ANOMALY]
MEASURE_TYPE_IDS = 2,6

# Lascia vuoto per autodiscovery di tutte le stazioni.
STATION_IDS =

# Finestra di analisi (ore). Piu' alta = piu' affidabile, ma piu' carico.
# 6h e' un buon compromesso per stuck detection con misure ogni 1-15 min.
LOOKBACK_HOURS = 6

# Soglia stuck: lo stesso identico valore ripetuto >= N volte di fila
# diventa allarmante. Calibrata sulla cadenza tipica AAO (1/min pioggia,
# 1/15min livmis):
#   - 60 valori = ~1 ora di pioggia bloccata, oppure ~15 ore di livmis bloccato
#   - Per livmis, di notte e con magra prolungata, valori costanti sono normali
#     -> alza la soglia o tieni d'occhio i falsi positivi
STUCK_THRESHOLD = 60

# Affidabilita': valori AAO "ok" hanno affid=10. Altri valori indicano
# qualita' degradata. Se piu' del LOW_AFFID_RATIO_THRESHOLD delle misure
# ha affid diverso, si segnala LOW_AFFID.
AFFID_OK_VALUE = 10
LOW_AFFID_RATIO_THRESHOLD = 0.1

# Limite stazioni per run (safety in modalita' autodiscovery)
MAX_STATIONS = 100
