[CONFIG]

ELASTIC_ENABLED = True

MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False


KPI_INDEX = logs-iride-insula-kpi.monitoring-default

# Cartella per collector_insula_kpi_iride_elastic.log e .debug.log
# (vuoto = stessa cartella dello script)
LOG_DIR =

# ============================================================
# Insula API (CGI)
# Documentazione: https://cgi-italy.github.io/insula/apis/cyberitaly/
# ============================================================
[INSULA]
BASE_URL = https://iride-cyberitaly.space/secure/api/v2.0

# ============================================================
# Keycloak (credenziali ricevute da Davide Foschi su CIMS-38, 13/07/2026)
# admin-cli e' public client, no secret richiesto.
# ============================================================
[KEYCLOAK]
URL = https://identity.iride-cyberitaly.space
REALM = cyberitaly
CLIENT_ID = admin-cli
CLIENT_SECRET =
USERNAME = cyberitaly-monitoring
PASSWORD = 

# ============================================================
# KPI: Availability of data catalogue and access services
# ============================================================
[INSULA_KPI]

# ---------- 1) Sonda catalogo ----------
# GET /search  -- 'catalogue' e' obbligatorio.
# Cataloghi disponibili su IRIDE CyberItaly:
#   ADAM_DATA          [Iride CyberItaly]  <-- il catalogo dati IRIDE
#   PLATFORM_PRODUCTS  [Output Products]
#   REF_DATA           [Reference]
#   SATELLITE          [Open Data]  (dipende da provider esterni: sconsigliato
#                                    per un KPI di disponibilita' della piattaforma)
# I valori ammessi sono dinamici. Per ricavarli:
#     python3 collector_insula_kpi_iride_elastic.py --discover
# che interroga /search/parameter/catalogue, /search/parameters e /collections.
# ATTENZIONE: se il catalogue scelto richiede una collection e la si lascia
# vuota, Insula NON risponde 400 ma HTTP 500.
CATALOGUE = ADAM_DATA

# Ogni catalogo pretende UN parametro obbligatorio. Valorizzare SOLO quello
# corrispondente al CATALOGUE scelto:
#
#   CATALOGUE = ADAM_DATA          -> CATALOGUE_ADAM_COLLECTION    (Iride CyberItaly)
#   CATALOGUE = PLATFORM_PRODUCTS  -> CATALOGUE_COLLECTION         (Output Products)
#   CATALOGUE = REF_DATA           -> CATALOGUE_REFDATA_COLLECTION (Reference)
#   CATALOGUE = SATELLITE          -> CATALOGUE_MISSION            (Open Data, terze parti)
#
# Se il parametro richiesto e' vuoto la sonda va NOK subito, senza chiamare
# l'API: Insula in quel caso risponde HTTP 500 e non 400.
CATALOGUE_ADAM_COLLECTION = IRIDE_HEO
CATALOGUE_COLLECTION =
CATALOGUE_REFDATA_COLLECTION =
CATALOGUE_MISSION =

# Parametri aggiuntivi liberi, formato: chiave=valore, chiave=valore
# Es. per SATELLITE + sentinel2:  CATALOGUE_EXTRA_PARAMS = s2ProcessingLevel=LEVEL2A
CATALOGUE_EXTRA_PARAMS =

# Risultati richiesti: 1 basta, si misura la risposta non la paginazione
CATALOGUE_PAGE_SIZE = 1

# > 0 aggiunge un filtro temporale sugli ultimi N giorni.
# LASCIARE A 0 con CATALOGUE = ADAM_DATA: quel catalogo non espone productDate
# (lo script lo ignora e logga un warning, ma tanto vale non chiederlo).
# Nota: il manuale documenta productDateStart/productDateEnd, l'API viva
# dichiara 'productDate'. Verificare con --param productDate prima di usarlo.
CATALOGUE_LOOKBACK_DAYS = 0

# True = se la query risponde 200 ma con 0 prodotti la sonda va NOK.
# Lasciare False se la collection puo' legittimamente essere vuota.
CATALOGUE_EXPECT_RESULTS = False

# Sonda leggera GET /search/parameters (handshake del servizio catalogo)
CHECK_SEARCH_PARAMETERS = True

# ---------- 2) Sonda accesso file ----------
# Il file di prova viene scelto DINAMICAMENTE: fra i candidati restituiti da
# parametricFind viene misurato ciascuno e scelto il piu' piccolo entro i limiti.
# La scelta finisce in cache e viene riverificata a ogni run: se il file viene
# cancellato o cambia dimensione oltre soglia, la discovery riparte da sola.
#
# parametricFind NON espone fileSize, quindi la dimensione si ricava da /dl
# con HEAD (Content-Length) o con GET Range: bytes=0-0 (Content-Range),
# senza scaricare il contenuto.

# Opzionale: se valorizzato salta selezione e cache e usa sempre questo ID.
DOWNLOAD_PLATFORM_FILE_ID =

# Criteri di ricerca dei candidati
DOWNLOAD_LOOKUP_TYPE = REFERENCE_DATA
DOWNLOAD_LOOKUP_FILTER =
DOWNLOAD_LOOKUP_COLLECTION =

# Quanti candidati chiedere e quanti misurarne al massimo.
# Ogni misura = 1 richiesta HTTP, ma si paga solo quando la cache e' fredda.
CANDIDATE_POOL_SIZE = 25
MAX_SIZE_PROBES = 25
CANDIDATE_SORT = id,desc

# Limiti di dimensione. Il piu' piccolo che rientra vince.
# 10485760 = 10 MB
MAX_DOWNLOAD_BYTES = 10485760
MIN_DOWNLOAD_BYTES = 1

# ---------- 2b) Modalita' di verifica del download ----------
# IMPORTANTE: su IRIDE CyberItaly il download di un platformFile e' TARIFFATO
# (wallet a coin). A credito esaurito l'API risponde HTTP 402 con
# "Estimated download cost (N ONE_OFF coins) exceeds current wallet balance".
# Una sonda in cron ogni 5 minuti = ~288 addebiti al giorno.
#
# VERIFICATO SU IRIDE CYBERITALY (22/07/2026): anche le richieste Range sono
# tariffate. Con wallet vuoto, 'ranged' fallisce esattamente come 'full'.
#
#   head    solo HEAD: verifica l'accessibilita' senza trasferire contenuto.
#           DEFAULT finche' l'utenza di monitoraggio non e' esentata dal billing.
#   ranged  GET Range sui primi DOWNLOAD_RANGE_BYTES byte. TARIFFATO.
#   full    GET completo: massima fedelta', 1 coin per run.
DOWNLOAD_MODE = full
DOWNLOAD_RANGE_BYTES = 4096

# True  = un 402 per credito esaurito conta come NOK (default)
# False = il 402 non fa scendere il KPI, ma resta tracciato nei campi
#         billing_blocked / download_error_class per un pannello dedicato.
#         Da usare solo se il KPI deve misurare la salute della piattaforma
#         e non l'entitlement dell'utenza di monitoraggio.
BILLING_ERRORS_AS_NOK = True

# Come misurare la dimensione dei candidati.
#   auto   HEAD, poi ripiego su Range
#   head   solo HEAD (nessun trasferimento, nessun addebito)
#   range  solo Range  -- TARIFFATO su questa piattaforma
#   none   nessuna misura: prende il primo candidato. Zero richieste, zero costi.
SIZE_PROBE_METHOD = head

# VERIFICATO 22/07/2026: ogni chiamata a /platformFiles/{id}/dl e' tariffata,
# HEAD compreso. Non e' il metodo a costare, e' toccare l'endpoint.
# Con la cache calda e DOWNLOAD_MODE = full il run costa 1 sola chiamata.
SKIP_REDUNDANT_SIZE_PROBE = True

# Usato solo per stimare il costo giornaliero nel log di fine run.
ASSUMED_CRON_MINUTES = 15

# Dopo quanti file consecutivi con misura negata per credito smettere di
# provare e passare alla selezione di ripiego. Evita 25 richieste inutili.
ENTITLEMENT_ABORT_AFTER = 3

# Cache della selezione: mantiene lo stesso file fra un run e l'altro, cosi'
# le latenze sono confrontabili nel tempo. Vuoto = <LOG_DIR>/.insula_kpi_target.json
USE_SELECTION_CACHE = True
SELECTION_CACHE_FILE =

# ---------- 3) Rete e soglie ----------
HTTP_TIMEOUT = 30
RETRIES = 2
RETRY_BACKOFF_S = 2.0

# False = bypass dei proxy di sistema (le API sono raggiungibili in diretta)
USE_SYSTEM_PROXY = False
INSULA_VERIFY_CERTS = True

# Classificazione latenza sui singoli probe -> campo latency_status
LATENCY_WARN_MS = 3000
LATENCY_CRIT_MS = 10000

# True = un documento Elastic per ogni sonda, oltre all'aggregato
EMIT_INDIVIDUAL_PROBES = True

# ============================================================
# Sonde su servizi aggiuntivi (processing, collezioni) -- non tariffate
# ============================================================
# Coprono servizi distinti da catalogo e accesso file: se cadono, la
# piattaforma puo' avere il catalogo su ma non elaborare o non gestire le
# collezioni. Query gratuite.
[INSULA_SERVICES]
# GET /jobs/search/parametricFind -- il motore di processing risponde
PROBE_JOBS = True
# True = se non risulta alcun job la sonda va NOK (di norma lasciare False:
# una piattaforma appena avviata puo' legittimamente non avere job)
JOBS_EXPECT_ANY = False

# GET /collections -- il registro delle collezioni risponde
PROBE_COLLECTIONS = False
# True = se non risulta alcuna collezione la sonda va NOK
COLLECTIONS_EXPECT_ANY = True

# ============================================================
# Sonde OGC (WMS / WFS) -- accesso ai dati NON tariffato
# ============================================================
# Perche': /platformFiles/{id}/dl e' tariffato a coin e non e' sostenibile in
# cron. WMS e WFS sono servizi di accesso ai dati pensati per essere
# interrogati liberamente. Una GetMap trasferisce pixel veri, quindi verifica
# i "data access services" meglio di una HEAD.
#
# ATTENZIONE: che WMS/WFS non siano tariffati e' un'assunzione ragionevole,
# non verificata su questa piattaforma. Controllare il saldo del wallet dopo
# qualche run. Il contatore content_requests NON include queste chiamate.
[INSULA_OGC]
OGC_PROBE_ENABLED = False

#   capabilities  solo GetCapabilities (il servizio risponde e dichiara i layer)
#   getmap        solo GetMap (trasferimento di una tile)
#   both          entrambe (default)
OGC_MODE = both

# Solo i prodotti con visualizzazione (GEOTIFF, SHAPEFILE, MOSAIC) espongono
# _links.wms. I file generici NO: cercare fra gli OUTPUT_PRODUCT.
OGC_LOOKUP_TYPE = OUTPUT_PRODUCT
OGC_LOOKUP_COLLECTION =
OGC_CANDIDATE_POOL = 25

# Opzionale: pinna un file che si sa esporre un layer WMS
OGC_PLATFORM_FILE_ID =

OGC_GETMAP_SIZE = 256
OGC_WMS_VERSION = 1.3.0

# Correzioni ricavabili da --wms-debug, se la GetMap restituisce
# un ServiceException invece di un'immagine.
# True = rimuove il prefisso del workspace dal nome del layer
#        (es. incident33:raster -> raster)
OGC_STRIP_WORKSPACE = False
# Parametri da rimuovere dalla query, separati da virgola. Es: cql_filter, time
OGC_DROP_PARAMS =

# True  = una sonda OGC rossa fa scendere overall_status
# False = le sonde OGC restano informative (ogc_status a parte)
OGC_COUNTS_IN_KPI = True

OGC_CACHE_FILE =

# ============================================================
# Wallet: monitoraggio del saldo e ricarica
# ============================================================
# Endpoint ricavati dalla UI Perception (DevTools, 23/07/2026):
#   POST /secure/api/v2.0/wallets/{id}/credit   body {"amount": N}
#   GET  /secure/api/v2.0/wallets/current       (saldo)
# Autenticazione Bearer: lo stesso token del password grant.
#
# Prima di attivare la ricarica automatica eseguire la ricognizione:
#     collector_insula_kpi_iride_elastic.py --wallet-info
# che legge gli endpoint senza scrivere nulla.
[INSULA_WALLET]

# Legge il saldo a ogni run e lo pubblica su Elastic (wallet_balance).
# Utile a prescindere: consente di allertare PRIMA che il KPI si fermi.
WALLET_MONITOR = True

# Soglia di allerta: sotto questo valore il saldo e' segnalato come basso
# (campo wallet_balance_low, warning nel log). Non ricarica.
WALLET_LOW_THRESHOLD = 5

# Legge GET /wallets/{id}/transactions e pubblica il consumo reale su Elastic
# (wallet_tx_debit / wallet_tx_credit). Best-effort: non fa fallire il run.
WALLET_READ_TRANSACTIONS = True
WALLET_TRANSACTIONS_SIZE = 20

# ---------- ricarica automatica ----------
# DISATTIVATA per default. Attivare solo dopo aver confermato con CGI che
# l'auto-accredito e' una modalita' prevista per le utenze di servizio
# (richiesta aperta su CIMS-38).
WALLET_AUTORECHARGE = True

# ID del wallet. Vuoto = ricavato da /wallets/current.
# Dalla UI risulta 53 per cyberitaly-monitoring: verificare con --wallet-info.
WALLET_ID =

# Ricarica quando il saldo scende a questo valore o sotto
WALLET_MIN_BALANCE = 2

# Quanti coin caricare per volta
WALLET_RECHARGE_AMOUNT = 5

# ---------- tetti di sicurezza ----------
# Impediscono che un bug o un cambio di prezzo lato piattaforma producano
# ricariche a catena. Al raggiungimento del tetto lo script si ferma e logga
# un errore: e' il segnale che il consumo e' diverso dal previsto.
# Vuoto oppure 0 = nessun limite.
WALLET_MAX_RECHARGES_PER_DAY =
WALLET_MAX_AMOUNT_PER_DAY =

# Stato dei conteggi giornalieri. Vuoto = <LOG_DIR>/.insula_kpi_wallet.json
WALLET_STATE_FILE =
