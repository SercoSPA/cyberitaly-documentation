; =============================================================================
; data_access_availability_iride_elastic.ini
; =============================================================================
; Config per il KPI "Availability of data retrieval, ingestion and access"
; — sonda la disponibilita' dell'accesso ai dati IRIDE CyberItaly esposti
; via SFTPGo (host ftp.dingest.iride-cyberitaly.space).
;
; Livello A: auth (GET /api/v2/token Basic Auth → JWT)
; Livello B: retrieval reale (GET /api/v2/user/dirs con API key user-scope)
;
; Credenziali riusate dallo script FTP_folder (admin SFTPGo cyberitalyadmin
; + API key user-scope legata all'utente target).
; =============================================================================

[CONFIG]
; -----------------------------------------------------------------------------
; Elasticsearch ingestion
; -----------------------------------------------------------------------------
ELASTIC_ENABLED = True
MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

; Index dedicato per la disponibilita' dell'accesso ai dati
SYNTHETIC_INDEX = logs-iride-data-access-availability.monitoring-default


; =============================================================================
; SFTPGo endpoint + credenziali
; =============================================================================
[SFTPGO]
BASE_URL = https://ftp.dingest.iride-cyberitaly.space

; Admin per il token JWT (livello A) — Basic Auth su GET /api/v2/token
USERNAME = cyberitalyadmin
PASSWORD =

; API key user-scope (scope=2) legata all'utente target, per il listing
; directory (livello B, retrieval). Header X-SFTPGO-API-KEY.
API_KEY = ubMNsMjYEqggRrsLsyozmK.6StWgBZybPsKnX2Yoe5Z75

; Directory da elencare come prova di retrieval. "/" = home dell'utente
; legato all'API key.
PROBE_PATH = /

; Timeout HTTP in secondi
HTTP_TIMEOUT = 30

; Soglie di latenza (millisecondi) sul peggior tempo tra auth e retrieval.
LATENCY_OK_MS = 3000
LATENCY_SLOW_MS = 10000
