; ===========================================================================
; insula_processing_iride_elastic.ini
; ---------------------------------------------------------------------------
; Configurazione di collector_insula_processing_iride_elastic.py
; KPI: "Availability of Processing services" - Insula (IRIDE CyberItaly)
; Requisito contrattuale: >= 95% di NWD-NWH
;
; I valori operativi qui sotto provengono dall'avanscoperta in sola lettura
; (recon_insula_processing_iride.py) e dal setup delle risorse
; (setup_insula_kpi_jobconfig.py), non da stime.
; ===========================================================================

[CONFIG]
; Spedizione degli eventi su Elasticsearch.
ELASTIC_ENABLED = True

MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

; Data stream dedicato: il KPI processing e' un requisito contrattuale
; DISTINTO da quello del catalogo e va tenuto separato anche in Elastic,
; cosi' i due pannelli non si contaminano.
KPI_INDEX = logs-iride-insula-processing.monitoring-default

; Vuoto = cartella dello script.
LOG_DIR =


[INSULA]
BASE_URL = https://iride-cyberitaly.space/secure/api/v2.0


[KEYCLOAK]
URL = https://identity.iride-cyberitaly.space
REALM = cyberitaly
CLIENT_ID =
CLIENT_SECRET =
USERNAME = cyberitaly-monitoring
PASSWORD = 


[INSULA_PROCESSING]

; ---------------------------------------------------------------------------
; LIVELLO 1 -- raggiungibilita' del motore (gratuito, a ogni run)
; ---------------------------------------------------------------------------
; Queste sonde erano nel collector del catalogo e ne sporcavano l'overall:
; un guasto del processing faceva scendere il KPI "data catalogue and access
; services", che e' un requisito diverso. Ora vivono qui.
; Nell'altro ini vanno messe a False:
;     [INSULA_SERVICES] PROBE_JOBS = False
;                       PROBE_COLLECTIONS = False
PROBE_JOBS = True

; True = se non risulta alcun job la sonda va NOK. Lasciare False: la
; piattaforma potrebbe legittimamente non averne, e non e' un guasto.
JOBS_EXPECT_ANY = False

; GET /jobConfigs -- prerequisito del lancio: se il registro non risponde,
; non si puo' lanciare nulla.
PROBE_JOBCONFIGS = True

; GET /services/{id} -- il processore esiste, non e' DISABLED, e la sua
; immagine docker e' ancora quella di riferimento.
PROBE_SERVICE = True

; ---------------------------------------------------------------------------
; LIVELLO 2 -- esecuzione reale (tariffato)
; ---------------------------------------------------------------------------
; False = il KPI misura la sola raggiungibilita' e lo dichiara nell'evento
; (kpi_level = "reachability"). Utile per far girare il collector prima di
; avere una jobConfig, o per sospendere il consumo di coin senza fermare
; tutto il monitoraggio.
JOB_LAUNCH_ENABLED = True

; Creata da setup_insula_kpi_jobconfig.py, di proprieta' di
; cyberitaly-monitoring. Input: kpi_sample.tif (502 byte) in collection
; propria; output in collection propria, quindi cancellabile.
JOB_LAUNCH_CONFIG_ID = 13581

; Service 2 = fastcopier. Scelto dopo il profilo storico: 102 job dal
; settembre 2024, 81.4% di successo, schema di input stabile su tutte le
; config, tre proprietari diversi (non dipende da una sola persona).
JOB_LAUNCH_SERVICE_ID = 2

; dockerTag congelato al momento del setup. Tutti i service di questa
; piattaforma sono IN_DEVELOPMENT, quindi l'immagine puo' cambiare senza
; preavviso: se cambia, l'evento riporta docker_tag_changed = true e va
; verificato che il processore si comporti ancora come atteso.
JOB_EXPECTED_DOCKER_TAG = userworkflow/fastcopier

; Cadenza REALE dei lanci, indipendente da quella del cron. Le sonde di
; livello 1 sono gratuite e conviene eseguirle spesso; il lancio costa.
;
; Con cron ogni 5 minuti e questo valore a 30, si lancia un run su sei:
;   raggiungibilita' -> 288 misure/giorno, gratuite
;   esecuzione       ->  48 misure/giorno, ~96 coin/giorno (2 coin a lancio)
;
; Lanciare a ogni run (valore 5) porterebbe a 288 lanci/giorno, ~576 coin
; al giorno e oltre 200.000 l'anno, per un guadagno statistico irrilevante
; su un requisito mensile al 95%.
JOB_LAUNCH_EVERY_MINUTES = 5

; Attesa massima della conclusione. Misurato: fastcopier chiude in 47-95 s.
;
; REGOLA: tenerla SOTTO l'intervallo del cron. Con cron ogni 5 minuti un
; valore di 4 garantisce che un run non si accavalli mai al successivo.
; Oltre il timeout il job NON viene dichiarato fallito: resta pendente e il
; run successivo ne raccoglie l'esito (campo job_resumed = true). Si perde
; qualche secondo di latenza nella rilevazione, non la misurazione.
JOB_MAX_WAIT_MINUTES = 4
JOB_POLL_INTERVAL_S = 15

; True = un job COMPLETED senza output e' considerato NOK. fastcopier deve
; produrre la copia del file: se non lo fa, ha "funzionato" solo in apparenza.
JOB_EXPECT_OUTPUTS = True

; Soglia di attenzione sulla durata: sopra questo valore l'evento riporta
; duration_over_threshold. Non fa scendere il KPI, serve ad accorgersi di un
; degrado prima che diventi un timeout.
JOB_DURATION_WARN_S = 300

; ---------------------------------------------------------------------------
; PULIZIA -- manutenzione, NON concorre al KPI
; ---------------------------------------------------------------------------
; Gli output finiscono nella collection di monitoraggio e vengono cancellati
; dopo la lettura dell'esito. Senza questo si accumulano ~17500 copie l'anno.
JOB_CLEANUP_OUTPUTS = True

; DELETE /jobs/{id} non e' nel manuale ma funziona (204, verificato). Senza,
; ogni lancio lascerebbe un record permanente su una piattaforma condivisa.
JOB_CLEANUP_JOB = True

; ---------------------------------------------------------------------------
; TARIFFAZIONE
; ---------------------------------------------------------------------------
; False = un lancio rifiutato per credito esaurito (HTTP 402) NON fa scendere
; il KPI. E' la scelta corretta: un wallet vuoto e' un problema
; amministrativo, non indisponibilita' della piattaforma. Il caso resta
; visibile tramite billing_blocked e wallet_balance, su cui si allerta a parte.
BILLING_ERRORS_AS_NOK = False

; ---------------------------------------------------------------------------
; STATO E RETE
; ---------------------------------------------------------------------------
; Tiene traccia dell'ultimo lancio e di un eventuale job rimasto pendente.
; Vuoto = <LOG_DIR>/.insula_processing_state.json
STATE_FILE =

; Lock contro i run sovrapposti: obbligatorio con cron frequente. Se un run
; e' ancora in corso, quello nuovo esce subito con codice 0 senza fare nulla.
; Vuoto = <LOG_DIR>/.insula_processing.lock
LOCK_FILE =

; Dopo quanti minuti un lock e' considerato abbandonato (processo ucciso,
; VM riavviata) e puo' essere rimosso. Deve essere piu' alto della durata
; massima plausibile di un run: JOB_MAX_WAIT_MINUTES piu' un margine.
LOCK_STALE_MINUTES = 30

HTTP_TIMEOUT = 60
RETRIES = 2
RETRY_BACKOFF_S = 2.0

; False = bypass del proxy aziendale (le API sono raggiungibili direttamente).
USE_SYSTEM_PROXY = False
INSULA_VERIFY_CERTS = True

LATENCY_WARN_MS = 3000
LATENCY_CRIT_MS = 10000

; Un evento per sonda oltre all'aggregato: serve per la state timeline in
; Grafana e per capire QUALE passo e' fallito, non solo che qualcosa e' andato
; storto.
EMIT_INDIVIDUAL_PROBES = True


[INSULA_WALLET]
; Il saldo e' una metrica monitorabile: consente di allertare PRIMA che il KPI
; si fermi, invece di scoprirlo da un 402.
WALLET_MONITOR = True

; ATTENZIONE ai numeri. Il campo costingExpression dichiara 1 coin per lancio,
; ma un lancio reale ne ha scalati 2 (misurato: saldo 4 -> 2). Il collector
; registra cost_measured a ogni run: verificare sul campo prima di fidarsi
; delle stime qui sotto.
;   con costo 2 e cadenza 30 min -> ~96 coin/giorno, ~35000/anno
WALLET_AUTORECHARGE = True

; Vuoto = risolto da GET /wallets/current.
WALLET_ID =

; Sotto questo saldo scatta la ricarica.
WALLET_MIN_BALANCE = 5

; Quanti coin per ricarica.
WALLET_RECHARGE_AMOUNT = 40

; Tetti giornalieri: sono la rete di sicurezza contro un cambio di
; tariffazione lato piattaforma o un bug che lanci in loop. Vuoto o 0 =
; nessun limite, sconsigliato.
; Con ~96 coin/giorno di consumo, ricariche da 40 significano ~3 ricariche
; al giorno: il tetto di 6 lascia margine senza diventare illimitato.
; ATTENZIONE: il collector del catalogo attinge allo stesso wallet con i
; propri tetti e un file di stato separato. I due non si vedono: la somma
; dei consumi va tenuta a mente.
WALLET_MAX_RECHARGES_PER_DAY =
WALLET_MAX_AMOUNT_PER_DAY =

; Soglia di allerta (non di ricarica): sotto questa il campo
; wallet_balance_low va a true e si puo' allertare in Grafana.
WALLET_LOW_THRESHOLD = 10

; Vuoto = <LOG_DIR>/.insula_processing_wallet.json
WALLET_STATE_FILE =

