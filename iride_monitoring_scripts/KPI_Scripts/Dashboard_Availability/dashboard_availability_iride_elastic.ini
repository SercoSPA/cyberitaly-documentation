; =============================================================================
; dashboard_availability_iride_elastic.ini
; =============================================================================
; Config per il KPI "Availability of visualization and user dashboards
; services" — sonda la disponibilita' della dashboard utente IRIDE
; CyberItaly (applicazione "perception").
;
; Livello A: reachability front-end (HTTP GET + latenza)
; Livello B: backend autenticato (Keycloak password grant + API Insula
;            /jobs che alimenta la dashboard)
;
; Credenziali riusate dallo script API_Insula_Awereness (utente di
; servizio Keycloak "cyberitaly-monitoring", realm cyberitaly, client
; pubblico admin-cli).
; =============================================================================

[CONFIG]
; -----------------------------------------------------------------------------
; Elasticsearch ingestion
; -----------------------------------------------------------------------------
ELASTIC_ENABLED = True
MONITORING_URL = https://ci-mon-db-01:9200
MONITORING_APIKEY =
MONITORING_VERIFY_CERTS = False

; Index dedicato per la disponibilita' della dashboard
SYNTHETIC_INDEX = logs-iride-dashboard-availability.monitoring-default


; =============================================================================
; Front-end dashboard (livello A)
; =============================================================================
[DASHBOARD]
; URL della dashboard utente da sondare (perception app).
FRONTEND_URL = https://iride-cyberitaly.space/perception/dashboard/hydraulic_supervised/53/default?jobs=

; Timeout HTTP in secondi
HTTP_TIMEOUT = 30

; Soglie di latenza (millisecondi) applicate al peggior tempo di risposta
; tra front-end e backend. Oltre SLOW → FAIL; tra OK e SLOW → SLOW.
LATENCY_OK_MS = 3000
LATENCY_SLOW_MS = 10000


; =============================================================================
; Backend API Insula (livello B) — dati che alimentano la dashboard
; =============================================================================
[INSULA]
BASE_URL = https://iride-cyberitaly.space/secure/api/v2.0
; Chiamata leggera: 1 solo job, serve solo a provare che il backend risponde.
JOBS_PROBE_PATH = /jobs?size=1


; =============================================================================
; Keycloak (auth backend) — CIMS-38, utente di servizio
; =============================================================================
[KEYCLOAK]
URL = https://identity.iride-cyberitaly.space
REALM = cyberitaly
CLIENT_ID = admin-cli
CLIENT_SECRET =
USERNAME = cyberitaly-monitoring
PASSWORD = 